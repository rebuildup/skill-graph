name: CI
on:
  push:
    branches: [main, "release-*"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-guard:
    # Release-driven delivery: ticket PRs must target the active
    # release branch; `main` only accepts release-* integration PRs
    # (#144 運用違反の再発防止 — main への直接統合を CI で構造的に
    # 拒否する)。Push events have no base_ref and skip this check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: PR refs must follow the release-driven delivery model
        # Refs pass through env, never `${{ }}` interpolation: ref names
        # may legally contain `$`, backticks, `;`, quotes, and
        # parentheses, so direct interpolation is script injection on
        # attacker-controlled fork branch names (#144 R23).
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          # Ticket PRs integrate into a release-* branch. The only
          # main-bound PR allowed is a release-* integration head —
          # and that head must live in THIS repository: a fork branch
          # named `release-*` is attacker-controlled and proves
          # nothing (#221). `release-*` is a naming convention, not
          # proof of release status — the human merge-approval
          # boundary for main covers the residual (#144). Push events
          # skip this job entirely.
          head_is_release=0
          if [[ "$HEAD_REF" == release-* && "$HEAD_REPO" == "$REPO" ]]; then
            head_is_release=1
          fi
          if [[ "$BASE_REF" != release-* ]] &&
             { [ "$BASE_REF" != "main" ] || [ "$head_is_release" -ne 1 ]; }; then
            echo "ticket PRs must target a release-* branch;" >&2
            echo "main-bound PRs must come from a same-repo release-* branch." >&2
            exit 1
          fi
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          # publish-npm.sh's pkg-preflight.mjs parses package.json with
          # a real JSON parser — node is guaranteed wherever npm runs,
          # and making it explicit keeps the publish-path tests honest.
          node-version: "22"
      - name: OpenCode plugin bundles
        # Syntax/bundle check for the embedded plugin source; type
        # resolution against @opencode/plugin is out of scope here.
        run: |
          bun build src/assets/opencode-plugin.ts \
            --external '@opencode/plugin' \
            --outfile /tmp/opencode-plugin.js
      - name: OpenCode plugin contract tests
        # safeSessionID parity with SessionId::normalize is part
        # of the event contract — verify it, don't assume it (#225).
        run: bun test src/assets/opencode-plugin.test.ts
      - name: Release verification scripts
        # The npm publish path relies on verify-npm-{arch,tarballs,
        # registry}.sh; their accept/reject behavior — including
        # mismatch, missing/extra files, corrupt tarballs, wrong arch —
        # is a contract, so it is regression-tested here (#225
        # re-review).
        run: bash scripts/test-release-verify.sh
      - name: Npm publish path tests
        # publish-npm.sh decides skip-vs-publish and proves registry
        # content identity on both paths; test-npm-publish.sh drives it
        # end-to-end against a stub npm registry — divergent published
        # content, tampered post-publish artifacts, and missing
        # executables must all be rejected (#225 re-review).
        run: bash scripts/test-npm-publish.sh
      - name: Package versions agree
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          cargo = pathlib.Path("Cargo.toml").read_text()
          version = re.search(r'^version = "([^"]+)"', cargo, re.M).group(1)
          paths = [pathlib.Path("plugins/skill-graph/plugin.json")]
          paths += sorted(pathlib.Path("npm").glob("*/package.json"))
          bad = [
              f"{p}: {json.loads(p.read_text()).get('version')} != {version}"
              for p in paths
              if json.loads(p.read_text()).get("version") != version
          ]
          # optionalDependencies pins must track the release version too:
          # a stale pin silently resolves npm installs to the old binary.
          for p in paths:
              if p.name != "package.json":
                  continue
              deps = json.loads(p.read_text()).get("optionalDependencies") or {}
              stale = {k: v for k, v in deps.items() if v != version}
              if stale:
                  bad.append(f"{p}: optionalDependencies not at {version}: {stale}")
          # The optionalDependencies name set must equal the set of
          # platform packages that actually ship: a missing or renamed
          # dep passes every version check but 404s at install time
          # (#144 r17).
          meta = json.loads(pathlib.Path("npm/skill-graph/package.json").read_text())
          dep_names = set((meta.get("optionalDependencies") or {}).keys())
          pkg_names = {
              json.loads(p.read_text())["name"]
              for p in pathlib.Path("npm").glob("skill-graph-*/package.json")
          }
          if dep_names != pkg_names:
              bad.append(
                  "optionalDependencies "
                  f"{sorted(dep_names)} != platform packages {sorted(pkg_names)}"
              )
          if bad:
              sys.exit("version mismatch: " + "; ".join(bad))
          PY
      - name: Crate contains only intended files
        run: |
          cargo package --list --allow-dirty | sort > /tmp/crate-files.txt
          if grep -Eq '^(tests|evals|npm|docs|plugins|adapters|experiments|\.github|\.agents|\.claude|\.devin)/' /tmp/crate-files.txt; then
            echo "unexpected files in crate package:" >&2
            grep -E '^(tests|evals|npm|docs|plugins|adapters|experiments|\.github|\.agents|\.claude|\.devin)/' /tmp/crate-files.txt >&2
            exit 1
          fi
  msrv:
    # Cargo.toml declares rust-version; keep the guarantee honest by
    # compiling and testing on exactly that toolchain (#130 — declared
    # MSRV was previously unverified). The toolchain is read from the
    # manifest so a rust-version bump can never drift from CI.
    # RUSTUP_TOOLCHAIN is required: rust-toolchain.toml in the repo
    # (newer channel) takes precedence over the action's default
    # toolchain, which would silently test the wrong rustc (#221).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read declared rust-version
        id: msrv
        run: |
          v="$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          [ -n "$v" ] || { echo "rust-version missing in Cargo.toml" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --locked --all-targets
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
      - run: cargo test --locked
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
