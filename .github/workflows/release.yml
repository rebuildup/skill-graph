name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build release assets for"
        required: true
      freeze_run_id:
        description: "artifact-verify run ID whose frozen artifacts to promote (required for dispatch; tag push resolves the run triggered by that tag)"
        required: false

permissions:
  contents: write
  actions: read      # resolve the artifact-verify (freeze) run for the tag SHA
  attestations: read # verify build-provenance attestations before publish

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag_sha: ${{ steps.tag.outputs.tag_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Bind checkout to the release tag commit
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Tag names reach shell via env only; validate before any use.
          [[ "$RELEASE_TAG" =~ ^v[0-9A-Za-z._-]+$ ]] || {
            echo "invalid tag: $RELEASE_TAG"; exit 1; }
          # checkout's ref resolution can prefer a same-named branch over
          # the tag, and a branch-resolved checkout does not fetch the
          # tag ref — fetch it explicitly so the comparison below always
          # sees the real tag object (#144 r20).
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          # Peel annotated tags to the commit: refs/tags/<tag> alone
          # resolves to the tag object for annotated tags, which would
          # never equal HEAD's commit SHA.
          tag_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          head_sha="$(git rev-parse HEAD)"
          [ "$head_sha" = "$tag_sha" ] || {
            echo "checked-out HEAD $head_sha is not tag $RELEASE_TAG ($tag_sha)"; exit 1; }
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
  # NO build job: release does not rebuild. artifact-verify.yml is the
  # single build+verify+freeze path — it produces the deterministic
  # tarball, proves it natively on the target runner, install-verifies
  # it auth-free, digests it, and attests provenance. The release job
  # below PROMOTES those frozen bytes: it resolves the successful
  # artifact-verify run for the tag commit, downloads the frozen
  # artifacts, and re-verifies every sha256 digest before upload —
  # published bytes are byte-identical to verified bytes (#225 r10).
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag_sha }}
      - name: Resolve the PINNED freeze run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_SHA: ${{ needs.verify.outputs.tag_sha }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          FREEZE_RUN_ID_INPUT: ${{ github.event.inputs.freeze_run_id }}
        run: |
          set -euo pipefail
          # The approval target is pinned to ONE freeze run — never
          # "whatever succeeded most recently" (#225 r11). Two ways to
          # name it:
          #   * workflow_dispatch freeze_run_id — explicit pin; the
          #     operator picks the verified run after reviewing CI.
          #   * tag push — the artifact-verify run TRIGGERED BY THIS
          #     TAG (event=push, head_branch=<tag>). Same commit =>
          #     same inputs, but the binding is still to a specific
          #     run id, not a latest-success query.
          validate_run() {
            local id="$1" j
            j="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id")" || return 1
            # Promotable run definition (#225 A03): the artifact-verify
            # workflow, a PUSH event (PR runs are never promotable —
            # their checkout is a merge/PR head, not the released
            # commit), completed+success, head_sha == the tag commit,
            # and we capture run_attempt so the manifest's recorded
            # attempt can be matched exactly (a re-run's artifacts
            # supersede earlier attempts').
            [ "$(jq -r '.path' <<< "$j")" = ".github/workflows/artifact-verify.yml" ] || {
              echo "run $id is not artifact-verify.yml" >&2; return 1; }
            [ "$(jq -r '.event' <<< "$j")" = "push" ] || {
              echo "run $id event is not push" >&2; return 1; }
            [ "$(jq -r '.head_sha' <<< "$j")" = "$TAG_SHA" ] || {
              echo "run $id head_sha != tag commit $TAG_SHA" >&2; return 1; }
            [ "$(jq -r '.status' <<< "$j")" = "completed" ] || return 1
            [ "$(jq -r '.conclusion' <<< "$j")" = "success" ] || return 1
            RUN_ATTEMPT="$(jq -r '.run_attempt' <<< "$j")"
            RUN_EVENT="$(jq -r '.event' <<< "$j")"
            RUN_REF="$(jq -r '.head_branch' <<< "$j")"
          }
          if [ -n "$FREEZE_RUN_ID_INPUT" ]; then
            [[ "$FREEZE_RUN_ID_INPUT" =~ ^[0-9]+$ ]] || {
              echo "invalid freeze_run_id: $FREEZE_RUN_ID_INPUT" >&2; exit 1; }
            validate_run "$FREEZE_RUN_ID_INPUT"
            run_id="$FREEZE_RUN_ID_INPUT"
          else
            run_id=""
            for i in $(seq 1 80); do
              run_id="$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/artifact-verify.yml/runs?head_sha=$TAG_SHA&status=success&per_page=50" \
                --jq "[.workflow_runs[] | select(.event==\"push\" and .head_branch==\"$RELEASE_TAG\")][0].id // empty" \
                2>/dev/null || true)"
              [ -n "$run_id" ] && break
              if [ "$i" = "80" ]; then
                echo "no artifact-verify run triggered by tag $RELEASE_TAG for $TAG_SHA after 40min" >&2
                echo "freeze the commit first (push the tag and let artifact-verify finish)," >&2
                echo "or re-run this workflow with an explicit freeze_run_id." >&2
                exit 1
              fi
              sleep 30
            done
          fi
          # Re-validate the resolved run through the same promotable
          # definition — the list query is a filter, not a proof.
          validate_run "$run_id"
          echo "promoting artifacts from PINNED artifact-verify run $run_id (attempt $RUN_ATTEMPT)"
          {
            echo "FREEZE_RUN_ID=$run_id"
            echo "FREEZE_RUN_ATTEMPT=$RUN_ATTEMPT"
          } >> "$GITHUB_ENV"
      - name: Download frozen artifacts; verify the APPROVED manifest and every digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_SHA: ${{ needs.verify.outputs.tag_sha }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist frozen
          gh run download "$FREEZE_RUN_ID" --dir frozen
          # The approval record is the freeze-manifest.json produced by
          # the pinned run's freeze-manifest job — NOT something this
          # job regenerates (#225 A02). verify-freeze-manifest.py binds
          # it to run id + attempt + head_sha + event, then proves
          # EVERY listed artifact exists exactly once across the
          # downloaded frozen-* and approved-manifest dirs with its
          # recorded sha256 (#225 A01/A03/A05).
          manifest="frozen/approved-manifest/freeze-manifest.json"
          [ -f "$manifest" ] || {
            echo "approved-manifest artifact missing freeze-manifest.json" >&2; exit 1; }
          python3 scripts/verify-freeze-manifest.py "$manifest" \
            --run-id "$FREEZE_RUN_ID" \
            --run-attempt "$FREEZE_RUN_ATTEMPT" \
            --head-sha "$TAG_SHA" \
            --event push \
            --require-channel release \
            --require-channel npm \
            --require-channel npm-meta \
            --require-channel crates \
            --artifact-dir frozen
          # Per-target freeze-meta must still bind this run/SHA —
          # defense in depth behind the manifest check.
          shopt -s nullglob
          dirs=(frozen/frozen-*/)
          [ "${#dirs[@]}" -eq 4 ] || {
            echo "expected 4 frozen target artifacts, found ${#dirs[@]}" >&2; exit 1; }
          for d in "${dirs[@]}"; do
            meta="$d/freeze-meta.json"
            [ -f "$meta" ] || { echo "missing freeze-meta.json in $d" >&2; exit 1; }
            python3 - "$meta" "$FREEZE_RUN_ID" "$FREEZE_RUN_ATTEMPT" "$TAG_SHA" <<'PY'
          import json, sys
          meta, run_id, attempt, sha = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          m = json.load(open(meta))
          assert m["workflow"] == "artifact-verify.yml", m
          assert m["run_id"] == int(run_id), m
          assert m["run_attempt"] == int(attempt), m
          assert m["head_sha"] == sha, m
          assert m["asset"].startswith("skill-graph-") and m["asset"].endswith(".tar.gz"), m
          assert len(m["sha256"]) == 64, m
          PY
            tarball="$(python3 -c "import json;print(json.load(open('$meta'))['asset'])")"
            [ -f "$d/$tarball" ] || { echo "missing $tarball in $d" >&2; exit 1; }
            mv "$d/$tarball" dist/
          done
          shopt -u nullglob
          # The manifest verified above already proved every tarball
          # digest; re-assert the release asset set is complete.
          for asset in \
            skill-graph-x86_64-unknown-linux-gnu.tar.gz \
            skill-graph-aarch64-unknown-linux-gnu.tar.gz \
            skill-graph-aarch64-apple-darwin.tar.gz \
            skill-graph-x86_64-apple-darwin.tar.gz; do
            [ -f "dist/$asset" ] || { echo "missing frozen asset $asset" >&2; exit 1; }
          done
          # Build-provenance attestation bound to the APPROVED source:
          # signer workflow + source commit digest + signer repo — a
          # valid signature from any other workflow/run/SHA is
          # rejected (#225 A04). The run binding itself comes from the
          # manifest (run_id+attempt) verified above.
          cp "$manifest" freeze-manifest.json
          for f in dist/*.tar.gz; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "rebuildup/skill-graph/.github/workflows/artifact-verify.yml" \
              --signer-repo "rebuildup/skill-graph" \
              --source-digest "$TAG_SHA"
          done
          gh attestation verify freeze-manifest.json --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "rebuildup/skill-graph/.github/workflows/artifact-verify.yml" \
            --signer-repo "rebuildup/skill-graph" \
            --source-digest "$TAG_SHA"
          cat freeze-manifest.json
          ls -l dist/
      - name: Verify tag and version consistency
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Tag names reach shell via env only; validate before any use.
          [[ "$RELEASE_TAG" =~ ^v[0-9A-Za-z._-]+$ ]] || {
            echo "invalid tag: $RELEASE_TAG"; exit 1; }
          want="${RELEASE_TAG#v}"
          got=$(grep -m1 '^version' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          [ "$want" = "$got" ] || {
            echo "tag $RELEASE_TAG does not match Cargo.toml version $got"; exit 1; }
          # The checked-out ref must be the tag commit verified in the
          # `verify` job. checkout is pinned to that SHA, so compare
          # HEAD directly — resolving refs/tags/ here would fail because
          # a SHA checkout does not fetch tag refs (#144 r20).
          head_sha="$(git rev-parse HEAD)"
          [ "$head_sha" = "${{ needs.verify.outputs.tag_sha }}" ] || {
            echo "checked-out HEAD $head_sha is not the verified tag commit"; exit 1; }
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > ../sha256sums.txt
          cat ../sha256sums.txt
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          notes="docs/release/${tag}.md"
          [ -f "$notes" ] || notes=""
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" dist/*.tar.gz sha256sums.txt freeze-manifest.json \
              --title "skill-graph $tag" \
              ${notes:+--notes-file "$notes"} --verify-tag
            exit 0
          fi

          # Release already exists: published assets are immutable.
          # Downstream channels (homebrew-tap sha256, npm binaries,
          # mise) already reference these checksums, so a rerun must
          # verify bytes — never clobber (#130). Every failure path
          # below aborts the step; none may fall through to an upload
          # that could overwrite published assets (#221).
          published="$(gh release view "$tag" --json assets -q '.assets[].name' | sort)"

          if ! grep -qx 'sha256sums.txt' <<< "$published"; then
            # No checksum manifest published. Completing the asset set
            # is only safe when NO tarball assets exist yet (a fresh
            # partial release); if tarballs are already published we
            # cannot verify them, so refuse rather than overwrite.
            if grep -q '^skill-graph-.*\.tar\.gz$' <<< "$published"; then
              echo "release $tag has assets but no sha256sums.txt;" >&2
              echo "cannot verify published bytes — refusing to overwrite." >&2
              exit 1
            fi
            # Additive recovery (#225 A10): upload only what is
            # missing; a pre-existing freeze-manifest.json must be
            # byte-identical to the approved one, never clobbered.
            gh release upload "$tag" dist/*.tar.gz sha256sums.txt
            if grep -qx 'freeze-manifest.json' <<< "$published"; then
              work0="$(mktemp -d)"
              gh release download "$tag" --pattern 'freeze-manifest.json' \
                --dir "$work0" --clobber
              cmp "$work0/freeze-manifest.json" freeze-manifest.json || {
                echo "published freeze-manifest.json differs from the" >&2
                echo "approved manifest — refusing to continue." >&2
                exit 1; }
            else
              gh release upload "$tag" freeze-manifest.json
            fi
            exit 0
          fi

          work="$(mktemp -d)"
          # The manifest must download; any failure (network, auth,
          # rate limit) aborts here instead of masquerading as "no
          # manifest" (#221).
          gh release download "$tag" --pattern 'sha256sums.txt' \
            --dir "$work" --clobber
          published_sums="$work/sha256sums.txt"

          # The published manifest defines the expected asset set —
          # no hardcoded copy of the build matrix to drift (#221).
          awk '{print $NF}' "$published_sums" | sort > "$work/expected.txt"
          comm -23 "$work/expected.txt" \
            <(printf '%s\n' "$published" | sed '/^$/d' | sort) \
            > "$work/missing.txt" || true
          missing="$(cat "$work/missing.txt")"

          if ! diff <(sort "$published_sums") <(sort sha256sums.txt) > /dev/null; then
            echo "release $tag published checksums differ from this build." >&2
            echo "Published artifacts are immutable; publish a new tag instead." >&2
            diff <(sort "$published_sums") <(sort sha256sums.txt) || true
            exit 1
          fi

          # Manifest identical: this build reproduces the published
          # bytes. Now verify the published ASSETS themselves against
          # the manifest — a truncated, replaced, or unlisted asset
          # must be detected, not overwritten (#221). Missing assets
          # (in the manifest but not published) are uploaded below.
          work_assets="$work/assets"
          mkdir -p "$work_assets"
          gh release download "$tag" --pattern '*.tar.gz' \
            --dir "$work_assets" --clobber
          shopt -s nullglob
          tarballs=("$work_assets"/*.tar.gz)
          [ "${#tarballs[@]}" -gt 0 ] || {
            echo "no published tarballs found to verify"; exit 1; }
          for f in "${tarballs[@]}"; do
            name="$(basename "$f")"
            want="$(awk -v n="$name" '$NF==n{print $1}' "$published_sums")"
            [ -n "$want" ] || {
              echo "published asset $name is not in sha256sums.txt" >&2
              echo "asset set does not match the manifest — refusing to continue." >&2
              exit 1; }
            got="$(sha256sum "$f" | awk '{print $1}')"
            [ "$want" = "$got" ] || {
              echo "checksum mismatch for published asset $name" >&2
              echo "published artifacts are immutable — refusing to overwrite." >&2
              exit 1; }
          done
          shopt -u nullglob

          # freeze-manifest.json is the published APPROVAL RECORD —
          # produced by the pinned freeze run, never regenerated
          # here (#225 A02/A09). If a previous release already
          # published one, it must be BYTE-IDENTICAL to the approved
          # manifest: same run, attempt, SHA, and every artifact
          # digest. A divergent record means the approval binding is
          # inconsistent and must not pass silently. If absent, upload
          # ours (additive metadata; tarballs already verified).
          if grep -qx 'freeze-manifest.json' <<< "$published"; then
            gh release download "$tag" --pattern 'freeze-manifest.json' \
              --dir "$work" --clobber
            cmp "$work/freeze-manifest.json" freeze-manifest.json || {
              echo "published freeze-manifest.json differs from the" >&2
              echo "approved manifest — refusing to continue." >&2
              exit 1; }
          else
            gh release upload "$tag" freeze-manifest.json
          fi

          if [ -z "$missing" ]; then
            echo "release $tag assets verified against published checksums; no-op"
          else
            echo "release $tag missing assets:"; cat "$work/missing.txt"
            echo "uploading only the missing assets (no clobber)"
            # Upload each missing asset individually without --clobber:
            # a concurrent upload fails loudly instead of overwriting.
            while read -r asset; do
              [ -n "$asset" ] || continue
              gh release upload "$tag" "dist/$asset"
            done < "$work/missing.txt"
          fi
