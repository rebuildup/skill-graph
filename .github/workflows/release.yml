name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build release assets for"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package binary
        run: |
          bin="target/${{ matrix.target }}/release/skill-graph"
          strip "$bin" 2>/dev/null || true
          cp "$bin" "skill-graph-${{ matrix.target }}"
          mkdir -p pkg
          cp "$bin" pkg/skill-graph
          tar -czf "skill-graph-${{ matrix.target }}.tar.gz" -C pkg skill-graph
          rm -rf pkg
      - uses: actions/upload-artifact@v4
        with:
          name: skill-graph-${{ matrix.target }}
          path: |
            skill-graph-${{ matrix.target }}
            skill-graph-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify tag and version consistency
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Tag names reach shell via env only; validate before any use.
          [[ "$RELEASE_TAG" =~ ^v[0-9A-Za-z._-]+$ ]] || {
            echo "invalid tag: $RELEASE_TAG"; exit 1; }
          want="${RELEASE_TAG#v}"
          got=$(grep -m1 '^version' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          [ "$want" = "$got" ] || {
            echo "tag $RELEASE_TAG does not match Cargo.toml version $got"; exit 1; }
          # The checked-out ref must actually be this tag.
          git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null || {
            echo "tag $RELEASE_TAG does not exist"; exit 1; }
      - name: Checksums
        run: |
          cd dist
          sha256sum skill-graph-* > ../sha256sums.txt
          cat ../sha256sums.txt
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          notes="docs/release/${tag}.md"
          [ -f "$notes" ] || notes=""
          gh release create "$tag" dist/* sha256sums.txt \
            --title "skill-graph $tag" \
            ${notes:+--notes-file "$notes"} --verify-tag
