name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build release assets for"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag_sha: ${{ steps.tag.outputs.tag_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Bind checkout to the release tag commit
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Tag names reach shell via env only; validate before any use.
          [[ "$RELEASE_TAG" =~ ^v[0-9A-Za-z._-]+$ ]] || {
            echo "invalid tag: $RELEASE_TAG"; exit 1; }
          # checkout's ref resolution can prefer a same-named branch over
          # the tag, and a branch-resolved checkout does not fetch the
          # tag ref — fetch it explicitly so the comparison below always
          # sees the real tag object (#144 r20).
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          # Peel annotated tags to the commit: refs/tags/<tag> alone
          # resolves to the tag object for annotated tags, which would
          # never equal HEAD's commit SHA.
          tag_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          head_sha="$(git rev-parse HEAD)"
          [ "$head_sha" = "$tag_sha" ] || {
            echo "checked-out HEAD $head_sha is not tag $RELEASE_TAG ($tag_sha)"; exit 1; }
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The peeled tag commit resolved and verified in `verify` —
          # never the ambiguous tag/branch name (#144 r20).
          ref: ${{ needs.verify.outputs.tag_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package binary
        run: |
          bin="target/${{ matrix.target }}/release/skill-graph"
          strip "$bin" 2>/dev/null || true
          mkdir -p pkg
          cp "$bin" pkg/skill-graph
          # Deterministic archive: normalized tar metadata + gzip -n so a
          # rerun on the same commit/toolchain reproduces byte-identical
          # checksums. Published assets must be immutable; reruns verify
          # instead of overwriting (#130).
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf - -C pkg skill-graph | gzip -n > "skill-graph-${{ matrix.target }}.tar.gz"
          rm -rf pkg
      - uses: actions/upload-artifact@v4
        with:
          name: skill-graph-${{ matrix.target }}
          path: skill-graph-${{ matrix.target }}.tar.gz

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag_sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify tag and version consistency
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Tag names reach shell via env only; validate before any use.
          [[ "$RELEASE_TAG" =~ ^v[0-9A-Za-z._-]+$ ]] || {
            echo "invalid tag: $RELEASE_TAG"; exit 1; }
          want="${RELEASE_TAG#v}"
          got=$(grep -m1 '^version' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          [ "$want" = "$got" ] || {
            echo "tag $RELEASE_TAG does not match Cargo.toml version $got"; exit 1; }
          # The checked-out ref must be the tag commit verified in the
          # `verify` job. checkout is pinned to that SHA, so compare
          # HEAD directly — resolving refs/tags/ here would fail because
          # a SHA checkout does not fetch tag refs (#144 r20).
          head_sha="$(git rev-parse HEAD)"
          [ "$head_sha" = "${{ needs.verify.outputs.tag_sha }}" ] || {
            echo "checked-out HEAD $head_sha is not the verified tag commit"; exit 1; }
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > ../sha256sums.txt
          cat ../sha256sums.txt
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          notes="docs/release/${tag}.md"
          [ -f "$notes" ] || notes=""
          if gh release view "$tag" >/dev/null 2>&1; then
            # Release already exists: published assets are immutable.
            # Downstream channels (homebrew-tap sha256, npm binaries,
            # mise) already reference these checksums, so a rerun must
            # reproduce them byte-identically or fail — never clobber.
            existing="$(mktemp -d)"
            if gh release download "$tag" --pattern 'sha256sums.txt' \
                --dir "$existing" --clobber 2>/dev/null \
                && [ -f "$existing/sha256sums.txt" ]; then
              if diff <(sort "$existing/sha256sums.txt") \
                     <(sort sha256sums.txt) > /dev/null; then
                # Manifest identical: this build reproduces the published
                # bytes. Upload is then a no-op, but only needed if an
                # asset is actually missing from the release.
                expected="sha256sums.txt skill-graph-x86_64-unknown-linux-gnu.tar.gz skill-graph-aarch64-unknown-linux-gnu.tar.gz skill-graph-aarch64-apple-darwin.tar.gz skill-graph-x86_64-apple-darwin.tar.gz"
                actual="$(gh release view "$tag" --json assets -q '.assets[].name' | sort | tr '\n' ' ')"
                missing=""
                for a in $expected; do
                  case " $actual " in *" $a "*) ;; *) missing="$missing $a" ;; esac
                done
                if [ -z "$missing" ]; then
                  echo "release $tag assets already published with identical checksums; no-op"
                else
                  echo "release $tag missing assets:$missing — re-uploading identical bytes"
                  gh release upload "$tag" dist/*.tar.gz sha256sums.txt --clobber
                fi
              else
                echo "release $tag assets differ from this build." >&2
                echo "Published artifacts are immutable; publish a new tag instead." >&2
                diff <(sort "$existing/sha256sums.txt") <(sort sha256sums.txt) || true
                exit 1
              fi
            else
              # Release exists but has no checksum manifest (partial or
              # legacy release): completing the asset set is safe.
              gh release upload "$tag" dist/*.tar.gz sha256sums.txt --clobber
            fi
          else
            gh release create "$tag" dist/*.tar.gz sha256sums.txt \
              --title "skill-graph $tag" \
              ${notes:+--notes-file "$notes"} --verify-tag
          fi
