name: npm publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish npm packages for"
        required: true

permissions:
  contents: read
  actions: read      # download the pinned freeze run's artifacts
  id-token: write # required for `npm publish --provenance`

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Single source of truth for the npm platform set; consumed by both
    # the assemble and publish steps. Keep in sync with the release.yml
    # build matrix and npm/skill-graph optionalDependencies.
    env:
      TARGETS: |
        linux-x64:x86_64-unknown-linux-gnu
        linux-arm64:aarch64-unknown-linux-gnu
        darwin-x64:x86_64-apple-darwin
        darwin-arm64:aarch64-apple-darwin
    concurrency:
      group: npm-publish-${{ github.event.inputs.tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - name: Verify tag passes tests
        run: cargo test --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          # Fail fast on malformed or nonexistent tags before the
          # release-asset wait loop.
          [[ "$tag" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "invalid tag: $tag" >&2; exit 1; }
          # Peel annotated tags to the commit: refs/tags/<tag> alone
          # resolves to the tag object for annotated tags, which would
          # never equal HEAD's commit SHA.
          tag_sha="$(git rev-parse --verify "refs/tags/$tag^{commit}")" || { echo "tag $tag does not exist" >&2; exit 1; }
          # The checked-out ref must actually be this tag: checkout's
          # ref resolution can prefer a same-named branch over the tag,
          # which would publish the branch under the tag's provenance
          # (#144 r19).
          [ "$(git rev-parse HEAD)" = "$tag_sha" ] || {
            echo "checked-out HEAD is not tag $tag" >&2; exit 1; }
          {
            echo "RELEASE_TAG=$tag"
            echo "TAG_SHA=$tag_sha"
          } >> "$GITHUB_ENV"
      - name: Verify manifest versions match tag
        run: |
          set -euo pipefail
          want="${RELEASE_TAG#v}"
          for pkg in npm/skill-graph npm/skill-graph-*/; do
            [ -f "$pkg/package.json" ] || continue
            ver="$(node -p "require('./$pkg/package.json').version")"
            if [ "$ver" != "$want" ]; then
              echo "version mismatch: $pkg is $ver but tag is $want" >&2
              exit 1
            fi
          done
          pver="$(node -p "require('./plugins/skill-graph/plugin.json').version")"
          [ "$pver" = "$want" ] || {
            echo "plugins/skill-graph/plugin.json is $pver but tag is $want" >&2
            exit 1
          }
          # Cargo.toml parity too: cross-compiled payloads cannot be
          # executed here, so a wrong-version binary inside a tarball
          # would ship undetected (#144 r17).
          cver="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          [ "$cver" = "$want" ] || {
            echo "Cargo.toml is $cver but tag is $want" >&2
            exit 1
          }
          # The metapackage's optionalDependencies must pin the release
          # version — a stale pin silently ships the previous binary.
          stale="$(node -e "
            const d = require('./npm/skill-graph/package.json').optionalDependencies || {};
            const bad = Object.entries(d).filter(([,v]) => v !== process.argv[1]);
            if (bad.length) console.log(bad.map(([k,v]) => k + '@' + v).join(','));
          " "$want")"
          [ -z "$stale" ] || {
            echo "optionalDependencies not at $want: $stale" >&2
            exit 1
          }
      - name: Download the APPROVED freeze manifest and frozen npm artifacts
        # The GitHub Release's freeze-manifest.json IS the approval
        # record: release.yml publishes it only after binding it to a
        # pinned, verified artifact-verify run (#225 A02/A11). This
        # job never re-derives approval — it resolves the run the
        # manifest names, proves that run is promotable, downloads
        # ITS artifacts, and requires the downloaded manifest to be
        # byte-identical to the published one.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-assets frozen npm-out
          # The tag push and release.yml run concurrently; wait for
          # the approved manifest + release assets to appear.
          for i in $(seq 1 60); do
            if gh release download "$RELEASE_TAG" \
                 --pattern 'freeze-manifest.json' --pattern 'sha256sums.txt' \
                 --pattern 'skill-graph-*.tar.gz' \
                 --dir release-assets --clobber 2>/dev/null \
               && [ -f release-assets/freeze-manifest.json ] \
               && [ -f release-assets/sha256sums.txt ]; then
              break
            fi
            if [ "$i" = "60" ]; then
              echo "approved release assets for $RELEASE_TAG not ready after 20min" >&2
              exit 1
            fi
            echo "release assets for $RELEASE_TAG not ready (attempt $i), retrying in 20s"
            sleep 20
          done
          # The manifest names its freeze run — validate it is a
          # promotable run (artifact-verify workflow, push event,
          # success, this tag's commit, matching attempt).
          run_id="$(python3 -c "import json;print(json.load(open('release-assets/freeze-manifest.json'))['run_id'])")"
          run_attempt="$(python3 -c "import json;print(json.load(open('release-assets/freeze-manifest.json'))['run_attempt'])")"
          head_sha="$(python3 -c "import json;print(json.load(open('release-assets/freeze-manifest.json'))['head_sha'])")"
          [ "$head_sha" = "$TAG_SHA" ] || {
            echo "manifest head_sha $head_sha != tag commit $TAG_SHA" >&2; exit 1; }
          j="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          [ "$(jq -r '.path' <<< "$j")" = ".github/workflows/artifact-verify.yml" ] || {
            echo "manifest run_id $run_id is not artifact-verify.yml" >&2; exit 1; }
          [ "$(jq -r '.event' <<< "$j")" = "push" ] || {
            echo "manifest run event is not push" >&2; exit 1; }
          [ "$(jq -r '.head_sha' <<< "$j")" = "$TAG_SHA" ] || {
            echo "manifest run head_sha mismatch" >&2; exit 1; }
          [ "$(jq -r '.status' <<< "$j")" = "completed" ] || exit 1
          [ "$(jq -r '.conclusion' <<< "$j")" = "success" ] || exit 1
          [ "$(jq -r '.run_attempt' <<< "$j")" = "$run_attempt" ] || {
            echo "freeze run was re-run after approval (attempt $run_attempt -> $(jq -r '.run_attempt' <<< "$j")); frozen bytes may differ — refusing to publish" >&2
            exit 1; }
          gh run download "$run_id" --dir frozen
          # The artifact-carried manifest must be BYTE-IDENTICAL to
          # the release-published approval record.
          cmp release-assets/freeze-manifest.json frozen/approved-manifest/freeze-manifest.json || {
            echo "downloaded manifest differs from published approval record" >&2; exit 1; }
          # Every artifact the manifest names must exist exactly once
          # with its recorded digest — including all 5 npm tgz.
          python3 scripts/verify-freeze-manifest.py \
            frozen/approved-manifest/freeze-manifest.json \
            --run-id "$run_id" --run-attempt "$run_attempt" \
            --head-sha "$TAG_SHA" --event push \
            --require-channel release --require-channel npm \
            --require-channel npm-meta --require-channel crates \
            --artifact-dir frozen
          # Provenance for the exact bytes about to be published —
          # bound to the approved workflow and source commit (#225 A04).
          while IFS= read -r f; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "rebuildup/skill-graph/.github/workflows/artifact-verify.yml" \
              --signer-repo "rebuildup/skill-graph" \
              --source-digest "$TAG_SHA"
          done < <(find frozen -name '*.tgz' -type f)
          echo "npm artifacts verified against approved manifest (run $run_id attempt $run_attempt)"
      - name: Publish the FROZEN npm artifacts in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Publish the exact .tgz bytes the approved manifest
          # digests — never a re-pack (#225 A06/A11/A12). The manifest
          # is the artifact index: locate each npm-channel artifact by
          # its recorded channel+target, then hand the files to
          # publish-npm.sh in dependency order (platform packages
          # first — the metapackage's optionalDependencies must
          # resolve — metapackage last).
          manifest=frozen/approved-manifest/freeze-manifest.json
          tgzs=()
          while IFS=: read -r target triple; do
            [ -n "$target" ] || continue
            name="$(python3 -c "
          import json, sys
          m = json.load(open('$manifest'))
          hits = [n for n, a in m['artifacts'].items()
                  if a['channel'] == 'npm' and a.get('target') == '$target']
          assert len(hits) == 1, hits
          print(hits[0])")"
            f="$(find frozen -name "$name" -type f -print -quit)"
            [ -n "$f" ] || { echo "frozen tgz $name missing for $target" >&2; exit 1; }
            tgzs+=("$f")
          done <<< "$TARGETS"
          meta="$(python3 -c "
          import json
          m = json.load(open('$manifest'))
          hits = [n for n, a in m['artifacts'].items() if a['channel'] == 'npm-meta']
          assert len(hits) == 1, hits
          print(hits[0])")"
          f="$(find frozen/approved-manifest -maxdepth 1 -name "$meta" -type f -print -quit)"
          [ -n "$f" ] || { echo "frozen metapackage $meta missing" >&2; exit 1; }
          tgzs+=("$f")
          scripts/publish-npm.sh "${tgzs[@]}"
