name: npm publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish npm packages for"
        required: true

permissions:
  contents: read
  id-token: write # required for `npm publish --provenance`

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Single source of truth for the npm platform set; consumed by both
    # the assemble and publish steps. Keep in sync with the release.yml
    # build matrix and npm/skill-graph optionalDependencies.
    env:
      TARGETS: |
        linux-x64:x86_64-unknown-linux-gnu
        linux-arm64:aarch64-unknown-linux-gnu
        darwin-x64:x86_64-apple-darwin
        darwin-arm64:aarch64-apple-darwin
    concurrency:
      group: npm-publish-${{ github.event.inputs.tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - name: Verify tag passes tests
        run: cargo test --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          # Fail fast on malformed or nonexistent tags before the
          # release-asset wait loop.
          [[ "$tag" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "invalid tag: $tag" >&2; exit 1; }
          # Peel annotated tags to the commit: refs/tags/<tag> alone
          # resolves to the tag object for annotated tags, which would
          # never equal HEAD's commit SHA.
          tag_sha="$(git rev-parse --verify "refs/tags/$tag^{commit}")" || { echo "tag $tag does not exist" >&2; exit 1; }
          # The checked-out ref must actually be this tag: checkout's
          # ref resolution can prefer a same-named branch over the tag,
          # which would publish the branch under the tag's provenance
          # (#144 r19).
          [ "$(git rev-parse HEAD)" = "$tag_sha" ] || {
            echo "checked-out HEAD is not tag $tag" >&2; exit 1; }
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Verify manifest versions match tag
        run: |
          set -euo pipefail
          want="${RELEASE_TAG#v}"
          for pkg in npm/skill-graph npm/skill-graph-*/; do
            [ -f "$pkg/package.json" ] || continue
            ver="$(node -p "require('./$pkg/package.json').version")"
            if [ "$ver" != "$want" ]; then
              echo "version mismatch: $pkg is $ver but tag is $want" >&2
              exit 1
            fi
          done
          pver="$(node -p "require('./plugins/skill-graph/plugin.json').version")"
          [ "$pver" = "$want" ] || {
            echo "plugins/skill-graph/plugin.json is $pver but tag is $want" >&2
            exit 1
          }
          # Cargo.toml parity too: cross-compiled payloads cannot be
          # executed here, so a wrong-version binary inside a tarball
          # would ship undetected (#144 r17).
          cver="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          [ "$cver" = "$want" ] || {
            echo "Cargo.toml is $cver but tag is $want" >&2
            exit 1
          }
          # The metapackage's optionalDependencies must pin the release
          # version — a stale pin silently ships the previous binary.
          stale="$(node -e "
            const d = require('./npm/skill-graph/package.json').optionalDependencies || {};
            const bad = Object.entries(d).filter(([,v]) => v !== process.argv[1]);
            if (bad.length) console.log(bad.map(([k,v]) => k + '@' + v).join(','));
          " "$want")"
          [ -z "$stale" ] || {
            echo "optionalDependencies not at $want: $stale" >&2
            exit 1
          }
      - name: Download release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The tag push and release.yml run concurrently; wait for the
          # release assets to appear.
          mkdir -p dist
          for i in $(seq 1 60); do
            if gh release download "$RELEASE_TAG" --pattern 'skill-graph-*.tar.gz' --dir dist --clobber 2>/dev/null \
              && gh release download "$RELEASE_TAG" --pattern 'sha256sums.txt' --dir dist --clobber 2>/dev/null; then
              break
            fi
            if [ "$i" = "60" ]; then
              echo "release assets for $RELEASE_TAG not ready after 20min" >&2
              exit 1
            fi
            echo "release assets for $RELEASE_TAG not ready (attempt $i), retrying in 20s"
            sleep 20
          done
          ls -l dist/
      - name: Verify checksums
        run: |
          set -euo pipefail
          cd dist
          # Strict set verification (#225): `sha256sum -c` alone only
          # checks listed files that exist — an asset missing from the
          # manifest, or a manifest entry whose file never downloaded,
          # would pass silently. Require BOTH directions: every manifest
          # entry present+matching, and the downloaded tarball set
          # exactly equal to the manifest's file set.
          sha256sum -c sha256sums.txt
          awk '{print $NF}' sha256sums.txt | sort > /tmp/expected-assets.txt
          ls ./*.tar.gz | xargs -n1 basename | sort > /tmp/actual-assets.txt
          diff /tmp/expected-assets.txt /tmp/actual-assets.txt
          # And every platform target must have its asset.
          while IFS=: read -r target triple; do
            [ -n "$target" ] || continue
            grep -qx "skill-graph-${triple}.tar.gz" /tmp/expected-assets.txt || {
              echo "manifest missing asset for $target" >&2; exit 1; }
          done <<< "$TARGETS"
      - name: Assemble platform packages
        run: |
          set -euo pipefail
          while IFS=: read -r target triple; do
            [ -n "$target" ] || continue
            pkg="npm/skill-graph-${target}"
            mkdir -p "$pkg/bin" /tmp/sg-pkg
            tar -xzf "dist/skill-graph-${triple}.tar.gz" -C /tmp/sg-pkg
            # cp -p carries the frozen tarball's exec bit through
            # EXACTLY — no chmod repair: if the payload lacked +x the
            # assert below fails instead of silently fixing it
            # (#225 r10/r11).
            cp -p /tmp/sg-pkg/skill-graph "$pkg/bin/skill-graph"
            [ -x "$pkg/bin/skill-graph" ] || {
              echo "frozen payload lost exec bit: $pkg/bin/skill-graph" >&2
              exit 1
            }
            rm -rf /tmp/sg-pkg
            if [ "$target" = "linux-x64" ]; then
              got="$("$pkg/bin/skill-graph" --version)"
              want="${RELEASE_TAG#v}"
              [[ "$got" == *"$want"* ]] || {
                echo "version mismatch: binary reports '$got', expected $want" >&2
                exit 1
              }
            else
              # cross-compiled binaries cannot exec on this runner;
              # the standalone verifier checks object format AND
              # architecture with explicit rejection paths — covered by
              # scripts/test-release-verify.sh (#225 re-review).
              scripts/verify-npm-arch.sh "$target" "$pkg/bin/skill-graph"
            fi
          done <<< "$TARGETS"
      - name: Bundle portable plugin into metapackage
        run: |
          set -euo pipefail
          rm -rf npm/skill-graph/plugin npm/skill-graph/contracts
          cp -r plugins/skill-graph npm/skill-graph/plugin
          cp -r contracts npm/skill-graph/contracts
      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # The publish decision path — two-phase preflight (all
          # packages validated BEFORE any publish), skip-vs-publish,
          # registry content identity on BOTH paths, bin executability
          # and format, dependency order — lives in
          # scripts/publish-npm.sh so it is exercised end-to-end by
          # scripts/test-npm-publish.sh against a stub npm. This
          # workflow cannot run without NPM_TOKEN, so the logic must
          # be verifiable outside it (#225 re-review).
          # ONE invocation covers platform packages AND the
          # metapackage: its optionalDependencies are checked against
          # argument order, so the metapackage cannot precede its
          # platform packages (#225 r5).
          pkgs=()
          while IFS=: read -r target triple; do
            [ -n "$target" ] || continue
            pkgs+=("npm/skill-graph-${target}")
          done <<< "$TARGETS"
          pkgs+=("npm/skill-graph")
          scripts/publish-npm.sh "${pkgs[@]}"
