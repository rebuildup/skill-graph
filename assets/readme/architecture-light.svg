<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
<rect width="880" height="300" fill="#ffffff" rx="8"/>
<g fill="#1f2328"><text x="70" y="34" font-size="14" fill="#1f2328" text-anchor="start" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" opacity="1.0" font-weight="600">How a recommendation reaches the agent</text><text x="70" y="52" font-size="10.5" fill="#59636e" text-anchor="start" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" opacity="1.0">every call is a fresh process — state lives only in an append-only event log</text><rect x="42.0" y="92" width="132" height="68" rx="8" fill="#f6f8fa" opacity="1.0"/><rect x="42.0" y="92" width="132" height="68" rx="8" fill="none" stroke="#1f2328" stroke-width="1.4" opacity="0.55"/><text x="108.0" y="121" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" opacity="1.0" font-weight="600">Agent prompt</text><text x="108.0" y="140" font-size="10" fill="#59636e" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" opacity="1.0">payload on stdin</text><line x1="180.0" y1="126.0" x2="202.0" y2="126.0" stroke="#818b98" stroke-width="1.6" opacity="1.0"/><path d="M 202.0 126.0 l -7 -4 v 8 z" fill="#818b98"/><rect x="208.0" y="92" width="132" height="68" rx="8" fill="#b6d4f5" opacity="1.0"/><rect x="208.0" y="92" width="132" height="68" rx="8" fill="none" stroke="#0969da" stroke-width="1.4" opacity="0.55"/><text x="274.0" y="121" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" opacity="1.0" font-weight="600">skill-graph hook</text><text x="274.0" y="140" font-size="10" fill="#59636e" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" opacity="1.0">thin CLI · fail-open</text><line x1="346.0" y1="126.0" x2="368.0" y2="126.0" stroke="#818b98" stroke-width="1.6" opacity="1.0"/><path d="M 368.0 126.0 l -7 -4 v 8 z" fill="#818b98"/><rect x="374.0" y="92" width="132" height="68" rx="8" fill="#b6d4f5" opacity="1.0"/><rect x="374.0" y="92" width="132" height="68" rx="8" fill="none" stroke="#0969da" stroke-width="1.4" opacity="0.55"/><text x="440.0" y="121" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" opacity="1.0" font-weight="600">in-memory graph</text><text x="440.0" y="140" font-size="10" fill="#59636e" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" opacity="1.0">build + rank per call</text><line x1="512.0" y1="126.0" x2="534.0" y2="126.0" stroke="#818b98" stroke-width="1.6" opacity="1.0"/><path d="M 534.0 126.0 l -7 -4 v 8 z" fill="#818b98"/><rect x="540.0" y="92" width="132" height="68" rx="8" fill="#b8e6c4" opacity="1.0"/><rect x="540.0" y="92" width="132" height="68" rx="8" fill="none" stroke="#1a7f37" stroke-width="1.4" opacity="0.55"/><text x="606.0" y="121" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" opacity="1.0" font-weight="600">top-3 skills</text><text x="606.0" y="140" font-size="10" fill="#59636e" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" opacity="1.0">context injection</text><line x1="678.0" y1="126.0" x2="700.0" y2="126.0" stroke="#818b98" stroke-width="1.6" opacity="1.0"/><path d="M 700.0 126.0 l -7 -4 v 8 z" fill="#818b98"/><rect x="706.0" y="92" width="132" height="68" rx="8" fill="#f6f8fa" opacity="1.0"/><rect x="706.0" y="92" width="132" height="68" rx="8" fill="none" stroke="#1f2328" stroke-width="1.4" opacity="0.55"/><text x="772.0" y="121" font-size="12.5" fill="#1f2328" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" opacity="1.0" font-weight="600">agent continues</text><text x="772.0" y="140" font-size="10" fill="#59636e" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" opacity="1.0">session proceeds</text><text x="440.0" y="194" font-size="10.5" fill="#59636e" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" opacity="1.0">absent by design:</text><rect x="262.79999999999995" y="206" width="52.400000000000006" height="24" rx="12" fill="#f6f8fa" opacity="1.0"/><rect x="262.79999999999995" y="206" width="52.400000000000006" height="24" rx="12" fill="none" stroke="#d1242f" stroke-width="1" opacity="0.5"/><text x="288.99999999999994" y="222.5" font-size="10.5" fill="#59636e" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" opacity="1.0">daemon</text><rect x="327.19999999999993" y="206" width="65.2" height="24" rx="12" fill="#f6f8fa" opacity="1.0"/><rect x="327.19999999999993" y="206" width="65.2" height="24" rx="12" fill="none" stroke="#d1242f" stroke-width="1" opacity="0.5"/><text x="359.79999999999995" y="222.5" font-size="10.5" fill="#59636e" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" opacity="1.0">database</text><rect x="404.3999999999999" y="206" width="84.4" height="24" rx="12" fill="#f6f8fa" opacity="1.0"/><rect x="404.3999999999999" y="206" width="84.4" height="24" rx="12" fill="none" stroke="#d1242f" stroke-width="1" opacity="0.5"/><text x="446.5999999999999" y="222.5" font-size="10.5" fill="#59636e" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" opacity="1.0">index files</text><rect x="500.79999999999995" y="206" width="116.4" height="24" rx="12" fill="#f6f8fa" opacity="1.0"/><rect x="500.79999999999995" y="206" width="116.4" height="24" rx="12" fill="none" stroke="#d1242f" stroke-width="1" opacity="0.5"/><text x="559.0" y="222.5" font-size="10.5" fill="#59636e" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" opacity="1.0">resident process</text><text x="70" y="270" font-size="10" fill="#59636e" text-anchor="start" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" opacity="1.0">event log: append-only JSONL · prompt bodies stored as SHA-256 hashes only</text><text x="70" y="290" font-size="10" fill="#59636e" text-anchor="start" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" opacity="1.0">failure mode: hook always exits 0 — a broken graph can never block the agent</text></g>
</svg>
