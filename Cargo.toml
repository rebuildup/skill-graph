[package]
name = "skill-graph"
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Agent-agnostic discovery, resolution, and recommendation for installed Agent Skills"
repository = "https://github.com/rebuildup/skill-graph"
readme = "README.md"
keywords = ["agent-skills", "cli", "recommendation"]
categories = ["command-line-utilities"]
include = ["/src/**/*", "/contracts/**/*", "/Cargo.toml", "/LICENSE", "/README.md"]
exclude = ["/npm/**", "/examples/**", "/tests/**", "/evals/**", "/docs/**", "/adapters/**", "/experiments/**", "/.github/**", "/.agents/**", "/.claude/**", "/.devin/**"]

[dependencies]
clap = { version = "4", features = ["derive"] }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }
walkdir = "2"
rmcp = { version = "3.11.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
