[package]
name = "skill-graph"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Agent-agnostic discovery, resolution, and recommendation for installed Agent Skills"
repository = "https://github.com/rebuildup/skill-graph"
readme = "README.md"
keywords = ["agent-skills", "cli", "recommendation"]
categories = ["command-line-utilities"]
# `include` alone defines the crate contents; a separate `exclude` is
# ignored by cargo when `include` is present (and was stale anyway).
include = ["/src/**/*", "/contracts/**/*", "/Cargo.toml", "/LICENSE", "/README.md"]

[dependencies]
clap = { version = "4", features = ["derive"] }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }
walkdir = "2"
rmcp = { version = "3.11.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
jsonschema = "0.63.2"
