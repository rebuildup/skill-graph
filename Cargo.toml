[package]
name = "skill-graph"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Agent-agnostic discovery, resolution, and recommendation for installed Agent Skills"
repository = "https://github.com/rebuildup/skill-graph"
keywords = ["agent-skills", "cli", "recommendation"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
